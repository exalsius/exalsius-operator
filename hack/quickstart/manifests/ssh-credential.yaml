# k0rdent Credential wrapping the SSH private key that k0smotron uses to
# provision the worker node(s). The Secret `remote-ssh-key` is created by
# setup-management.sh from the key file (its data key must be `value`).
apiVersion: k0rdent.mirantis.com/v1beta1
kind: Credential
metadata:
  name: remote-cred
  namespace: kcm-system
spec:
  description: SSH key for the quickstart worker node(s)
  identityRef:
    apiVersion: v1
    kind: Secret
    name: remote-ssh-key
    namespace: kcm-system
---
# k0rdent convention: every Credential is paired with a (possibly empty)
# resource-template ConfigMap named <secret>-resource-template.
apiVersion: v1
kind: ConfigMap
metadata:
  name: remote-ssh-key-resource-template
  namespace: kcm-system
  labels:
    k0rdent.mirantis.com/component: "kcm"
  annotations:
    projectsveltos.io/template: "true"
