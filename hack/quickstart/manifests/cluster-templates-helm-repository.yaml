# Flux HelmRepository for exalsius's public cluster templates on GHCR.
# Anonymous pull; no credentials needed. The ClusterTemplate that sources it
# is generated by setup-management.sh from versions.env.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: exalsius-cluster-templates
  namespace: kcm-system
  labels:
    k0rdent.mirantis.com/managed: "true"
spec:
  type: oci
  interval: 10m
  url: oci://ghcr.io/exalsius/cluster-templates/charts
