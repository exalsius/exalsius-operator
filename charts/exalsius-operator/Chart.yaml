apiVersion: v2
name: exalsius-operator
description: >-
  Kubernetes operator that provisions ephemeral, multi-cloud AI clusters via
  k0rdent and deploys GPU workspaces (notebooks, LLM endpoints, Slurm, ...) onto
  them from a declarative catalog.
type: application
version: 0.12.0
appVersion: 0.12.0
kubeVersion: '>=1.28.0-0'
home: https://github.com/exalsius/exalsius-operator
icon: >-
  https://raw.githubusercontent.com/exalsius/exalsius-operator/main/docs/assets/logo.png
sources:
  - https://github.com/exalsius/exalsius-operator
keywords:
  - exalsius
  - operator
  - ai
  - machine-learning
  - gpu
  - multi-cloud
  - cluster-api
  - k0rdent
  - k0smotron
  - sveltos
  - workspaces
  - training
maintainers:
  - name: exalsius
    email: run.it@exalsius.ai
    url: https://exalsius.ai
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: 'true'
  artifacthub.io/operatorCapabilities: Full Lifecycle
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/exalsius/exalsius-operator#readme
    - name: Examples
      url: https://github.com/exalsius/exalsius-operator/tree/main/examples
    - name: Workspace hub
      url: https://github.com/exalsius/exalsius-workspace-hub
    - name: Changelog
      url: https://github.com/exalsius/exalsius-operator/blob/main/CHANGELOG.md
    - name: Support
      url: https://github.com/exalsius/exalsius-operator/issues
  artifacthub.io/crds: |
    - kind: Colony
      version: v1
      name: colonies.infra.exalsius.ai
      displayName: Colony
      description: >-
        A logical group of Kubernetes clusters, possibly spanning cloud
        providers. Each entry provisions a k0rdent ClusterDeployment; the
        operator wires up Cilium, aggregates kubeconfigs and publishes the
        GPU inventory of every child cluster.
    - kind: WorkspaceClass
      version: v1
      name: workspaceclasses.workspaces.exalsius.ai
      displayName: WorkspaceClass
      description: >-
        Cluster-scoped catalog entry for a workspace type. Pins a k0rdent
        ServiceTemplate (Helm chart), default resources, prerequisites,
        access endpoints and user-facing configuration prompts.
    - kind: WorkspaceDeployment
      version: v1
      name: workspacedeployments.workspaces.exalsius.ai
      displayName: WorkspaceDeployment
      description: >-
        A user's request to run a workspace of a given WorkspaceClass on a
        target child cluster. The operator creates a k0rdent ServiceSet per
        workspace and reports readiness and access URLs in the status.
  artifacthub.io/crdsExamples: |
    - apiVersion: infra.exalsius.ai/v1
      kind: Colony
      metadata:
        name: docker-colony
        namespace: default
      spec:
        colonyClusters:
          - clusterName: docker-1
            clusterDeploymentSpec:
              template: docker-hosted-cp-1-0-0
              credential: docker-stub-credential
              config:
                workersNumber: 2
    - apiVersion: workspaces.exalsius.ai/v1
      kind: WorkspaceClass
      metadata:
        name: jupyter-notebook
      spec:
        displayName: Jupyter Notebook
        description: Interactive Python notebook with JupyterLab UI
        serviceTemplate:
          name: jupyter-notebook-template
        deployTimeout: 20m
        defaultResources:
          perReplica:
            cpu: "2"
            memory: 8Gi
            storage: 20Gi
            gpuCount: 0
        accessEndpoints:
          - name: web
            protocol: HTTP
            port: 8888
            description: JupyterLab web interface
        userFacingConfig:
          - helmValuePath: notebookPassword
            displayName: Notebook Password
            description: Password to access the JupyterLab instance
            type: secret
            required: true
    - apiVersion: workspaces.exalsius.ai/v1
      kind: WorkspaceDeployment
      metadata:
        name: my-notebook
        namespace: kcm-system
      spec:
        workspaceClassRef: jupyter-notebook
        clusterDeploymentRef:
          name: docker-colony-docker-1
          namespace: kcm-system
        values:
          notebookPassword: change-me
