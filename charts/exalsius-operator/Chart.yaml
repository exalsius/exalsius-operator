apiVersion: v2
name: exalsius-operator
description: >-
  Kubernetes operator that provisions ephemeral, multi-cloud AI clusters via
  k0rdent and deploys GPU workspaces (notebooks, LLM endpoints, Slurm, ...) onto
  them from a declarative catalog.
type: application
version: 0.12.1
appVersion: 0.12.1
kubeVersion: '>=1.28.0-0'
home: https://github.com/exalsius/exalsius-operator
icon: >-
  https://raw.githubusercontent.com/exalsius/exalsius-operator/main/docs/assets/logo.png
sources:
  - https://github.com/exalsius/exalsius-operator
keywords:
  - exalsius
  - operator
  - ai
  - machine-learning
  - gpu
  - multi-cloud
  - cluster-api
  - k0rdent
  - k0smotron
  - sveltos
  - workspaces
  - training
maintainers:
  - name: exalsius
    email: run.it@exalsius.ai
    url: https://exalsius.ai
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: 'true'
  artifacthub.io/operatorCapabilities: Full Lifecycle
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/exalsius/exalsius-operator#readme
    - name: Quick start
      url: https://github.com/exalsius/exalsius-operator/blob/main/docs/quickstart.md
    - name: Concepts
      url: https://github.com/exalsius/exalsius-operator/blob/main/docs/concepts.md
    - name: Examples
      url: https://github.com/exalsius/exalsius-operator/tree/main/examples/quickstart
    - name: Workspace hub
      url: https://github.com/exalsius/exalsius-workspace-hub
    - name: Changelog
      url: https://github.com/exalsius/exalsius-operator/blob/main/CHANGELOG.md
    - name: Support
      url: https://github.com/exalsius/exalsius-operator/issues
  artifacthub.io/crds: |
    - kind: Colony
      version: v1
      name: colonies.infra.exalsius.ai
      displayName: Colony
      description: >-
        A logical group of Kubernetes clusters, possibly spanning cloud
        providers. Each entry provisions a k0rdent ClusterDeployment; the
        operator aggregates kubeconfigs and publishes the GPU inventory of
        every child cluster.
    - kind: WorkspaceClass
      version: v1
      name: workspaceclasses.workspaces.exalsius.ai
      displayName: WorkspaceClass
      description: >-
        Cluster-scoped catalog entry for a workspace type. Pins a k0rdent
        ServiceTemplate (Helm chart), default resources, prerequisites,
        access endpoints and user-facing configuration prompts.
    - kind: WorkspaceDeployment
      version: v1
      name: workspacedeployments.workspaces.exalsius.ai
      displayName: WorkspaceDeployment
      description: >-
        A user's request to run a workspace of a given WorkspaceClass on a
        target child cluster. The operator installs the prerequisites the
        class declares, gates on GPU capacity, creates a k0rdent ServiceSet
        per workspace and reports readiness and access URLs in the status.
  artifacthub.io/crdsExamples: |
    - apiVersion: infra.exalsius.ai/v1
      kind: Colony
      metadata:
        name: quickstart
        namespace: kcm-system
      spec:
        colonyClusters:
          - clusterName: child-1
            clusterDeploymentSpec:
              template: exalsius-remote-cluster-0-1-5
              credential: remote-cred
              config:
                controlPlaneNumber: 1
                k0sCloudProvider:
                  enabled: false
                k0smotron:
                  externalAddress: "203.0.113.10"
                  service:
                    type: NodePort
                    apiPort: 30443
                    konnectivityPort: 30132
                machines:
                  - address: "203.0.113.11"
                    user: root
                    port: 22
    - apiVersion: workspaces.exalsius.ai/v1
      kind: WorkspaceClass
      metadata:
        name: jupyter-notebook-0-3-0
        labels:
          workspaces.exalsius.ai/template: jupyter-notebook
          workspaces.exalsius.ai/version: "0.3.0"
      spec:
        displayName: Jupyter Notebook
        description: Single-user Jupyter Notebook on CPU, NVIDIA or AMD ROCm nodes.
        serviceTemplate:
          name: jupyter-notebook-0-3-0
          namespace: kcm-system
        defaultResources:
          replicas: 1
          perReplica:
            cpu: "4"
            memory: 8Gi
            storage: 20Gi
            gpuCount: 0
        accessEndpoints:
          - name: http
            protocol: HTTP
            port: 80
            description: Jupyter Notebook web UI
        userFacingConfig:
          - helmValuePath: notebookPassword
            displayName: Notebook Password
            description: Password to access the Jupyter web UI
            type: secret
            required: true
        deployTimeout: 15m
    - apiVersion: workspaces.exalsius.ai/v1
      kind: WorkspaceDeployment
      metadata:
        name: my-notebook
        namespace: kcm-system
      spec:
        workspaceClassRef: jupyter-notebook-0-3-0
        clusterDeploymentRef:
          name: quickstart-child-1
          namespace: kcm-system
        resources:
          perReplica:
            cpu: "2"
            memory: 4Gi
            storage: 10Gi
        values:
          notebookPassword: change-me-please
