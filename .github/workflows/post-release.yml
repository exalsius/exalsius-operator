name: Post-Release - Push Image and Helm Chart to GHCR

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Strip the leading "v" from the release tag (v0.9.0 -> 0.9.0) so the
      # image tag matches the chart appVersion. The chart's default install
      # pulls repository:<appVersion>, and release-please writes plain semver
      # (no "v") into Chart.yaml.
      - name: Resolve image version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Build and Push Release Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }},${{ env.IMAGE_NAME }}:latest
          # OCI labels link the GHCR package to this repository and identify the
          # release; Artifact Hub and GHCR both surface them.
          labels: |
            org.opencontainers.image.title=exalsius-operator
            org.opencontainers.image.description=Kubernetes operator for ephemeral multi-cloud AI clusters and GPU workspaces
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

  helm-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: helm package charts/exalsius-operator --destination dist

      - name: Push chart to GHCR (OCI)
        run: helm push dist/exalsius-operator-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      # Artifact Hub reads repository metadata (verified publisher, owners) from
      # the OCI reference tagged `artifacthub.io` next to the chart versions.
      # https://artifacthub.io/docs/topics/repositories/#oci-support
      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Push Artifact Hub repository metadata
        working-directory: charts/exalsius-operator
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
          oras push ghcr.io/${{ github.repository_owner }}/charts/exalsius-operator:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Attach chart to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} dist/exalsius-operator-*.tgz
