# Dependabot keeps Go modules, GitHub Actions and the Dockerfile base image current.
# Security updates are always opened; version updates are grouped to limit PR noise.
# Dependabot PR titles follow Conventional Commits so release-please picks them up.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    # KCM, k0smotron and the Sveltos addon-controller are pinned to the versions running
    # on the management cluster (Sveltos via k0rdent's ksm-projectsveltos provider).
    # Their Go APIs change between minors (KCM 1.12 turned
    # ClusterDeployment.spec.propagateCredentials into *bool; addon-controller 1.15
    # requires Go 1.27), so they are bumped by hand together with a management-cluster
    # upgrade, never by Dependabot.
    ignore:
      - dependency-name: "github.com/K0rdent/kcm"
      - dependency-name: "github.com/k0sproject/k0smotron"
      - dependency-name: "github.com/projectsveltos/addon-controller"
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      # Everything else. The exclude list keeps the kubernetes group's members out of
      # this one; without it Dependabot folds them into the catch-all group.
      go-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
