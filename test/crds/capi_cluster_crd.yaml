---
# Minimal clusters.cluster.x-k8s.io CRD for envtest. Only the fields the operator
# reads (spec.controlPlaneEndpoint) are typed; everything else is preserved.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusters.cluster.x-k8s.io
spec:
  group: cluster.x-k8s.io
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
    shortNames:
      - cl
  scope: Namespaced
  versions:
    - name: v1beta2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                controlPlaneEndpoint:
                  type: object
                  properties:
                    host:
                      type: string
                    port:
                      type: integer
                      format: int32
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
